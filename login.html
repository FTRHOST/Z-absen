<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        --bs-primary: #e5b82a;
        --bs-body-bg: #fdfbf7;
        --bs-body-color: #3e2723;
      }
      body {
        background-color: var(--bs-body-bg) !important;
        color: var(--bs-body-color) !important;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-primary {
        background-color: #e5b82a !important;
        border-color: #e5b82a !important;
        color: #3e2723 !important;
      }
      .btn-primary:hover {
        background-color: #d4af37 !important;
        border-color: #d4af37 !important;
      }
      .login-card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .login-header {
        background: linear-gradient(135deg, #e5b82a, #d4af37) !important;
        color: #3e2723 !important;
        padding: 30px 20px;
        text-align: center;
      }
      .login-header h3 {
        margin: 0;
        font-weight: 700;
      }
      .login-header a {
        color: #3e2723;
        font-weight: 600;
      }
      .login-header a:hover {
        color: #ffffff;
      }
      .login-body {
        padding: 40px 30px;
        background-color: #ffffff;
      }
      .form-control {
        padding: 12px 15px;
        border-radius: 8px;
      }
      .btn-login {
        padding: 12px;
        font-weight: bold;
        border-radius: 8px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div class="container" id="main-container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="text-center mb-4 placeholder-glow" id="logo-container">
            <div
              id="logo-skeleton"
              class="placeholder rounded-4"
              style="width: 86px; height: 86px; margin: 0 auto; display: block"
            ></div>
            <img
              id="login-logo"
              src=""
              alt="Logo"
              style="
                max-height: 86px;
                display: none;
                margin: 0 auto;
                border-radius: 12px;
              "
            />
          </div>
          <div class="card login-card">
            <div class="login-header placeholder-glow" id="title-container">
              <span
                id="title-skeleton"
                class="placeholder col-8 rounded"
                style="height: 33px; display: inline-block"
              ></span>
              <h3 id="login-title" class="d-none mb-0">ZIEDA ABSEN</h3>
              <div id="login-subteks-container" class="mt-2 opacity-75 small">
                Silakan masuk ke akun Anda
              </div>
            </div>
            <div class="login-body placeholder-glow" id="login-body-skeleton">
                <span class="placeholder col-4 mb-2 rounded" style="height: 15px; display: inline-block;"></span>
                <span class="placeholder col-12 mb-3 rounded" style="height: 48px; display: inline-block;"></span>
                
                <span class="placeholder col-4 mb-2 rounded" style="height: 15px; display: inline-block;"></span>
                <span class="placeholder col-12 mb-4 rounded" style="height: 48px; display: inline-block;"></span>
                
                <span class="placeholder col-12 rounded mb-3" style="height: 48px; display: inline-block;"></span>
                <div class="text-center">
                    <span class="placeholder col-6 rounded" style="height: 15px; display: inline-block;"></span>
                </div>
            </div>
            <div class="login-body d-none" id="login-body-real">
              <form id="loginForm" onsubmit="prosesLogin(event)">
                <div class="mb-3">
                  <label
                    for="inputNama"
                    class="form-label fw-bold small text-muted"
                    >Nama Pengguna</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="inputNama"
                    placeholder="Masukkan nama Anda"
                    required
                  />
                </div>
                <div class="mb-4">
                  <label
                    for="inputPassword"
                    class="form-label fw-bold small text-muted"
                    >Password</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="inputPassword"
                    placeholder="Masukkan password"
                    required
                  />
                </div>

                <div class="d-grid mb-3">
                  <button type="submit" class="btn btn-primary btn-login">
                    LOGIN
                  </button>
                </div>

                <div class="text-center mt-3">
                  <a href="#" class="text-decoration-none small"
                    >Lupa password? Hubungi HR</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Pustaka Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Konfigurasi Global -->
    <script src="env.js"></script>
    <script src="config.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          const { data } = await supabaseClient
            .from("app_settings")
            .select("nama_aplikasi, logo_url, login_subteks")
            .eq("id", 1)
            .single();
          if (data) {
            if (data.nama_aplikasi) {
              document.title = `Login - ${data.nama_aplikasi}`;
              document.getElementById("login-title").innerHTML =
                `${data.nama_aplikasi}`;
            }
            // Sembunyikan skeleton judul dan tampilkan teks aslinya
            document.getElementById('title-skeleton').classList.add('d-none');
            document.getElementById('login-title').classList.remove('d-none');
            
            if (data.login_subteks && window.marked) {
              const subteksHtml = marked.parse(data.login_subteks);
              // override padding/margin of p generated by marked
              document.getElementById("login-subteks-container").innerHTML = subteksHtml.replace(/<p>/g, '<p class="mb-0">');
            }
            
            if (data.logo_url) {
              const logoImg = document.getElementById("login-logo");
              if (logoImg) {
                // Saat gambar selesai diload, hilangkan skeleton logo dan form
                logoImg.onload = () => {
                    document.getElementById('logo-skeleton').classList.add('d-none');
                    logoImg.style.display = "block";
                    document.getElementById('login-body-skeleton').classList.add('d-none');
                    document.getElementById('login-body-real').classList.remove('d-none');
                };
                logoImg.onerror = () => {
                    document.getElementById('logo-skeleton').classList.add('d-none');
                    document.getElementById('login-body-skeleton').classList.add('d-none');
                    document.getElementById('login-body-real').classList.remove('d-none');
                };
                logoImg.src = data.logo_url;
              }
              
              // Set Favicon
              let link = document.querySelector("link[rel~='icon']");
              if (!link) {
                  link = document.createElement('link');
                  link.rel = 'icon';
                  document.head.appendChild(link);
              }
              link.href = data.logo_url;
            } else {
                // Tidak ada logo, sembunyikan skeleton logo dan tampilkan form
                document.getElementById('logo-skeleton').classList.add('d-none');
                document.getElementById('login-body-skeleton').classList.add('d-none');
                document.getElementById('login-body-real').classList.remove('d-none');
            }
          } else {
              document.getElementById('title-skeleton').classList.add('d-none');
              document.getElementById('login-title').classList.remove('d-none');
              document.getElementById('logo-skeleton').classList.add('d-none');
              document.getElementById('login-body-skeleton').classList.add('d-none');
              document.getElementById('login-body-real').classList.remove('d-none');
          }
        } catch (e) {
          console.error(e);
          document.getElementById('title-skeleton').classList.add('d-none');
          document.getElementById('login-title').classList.remove('d-none');
          document.getElementById('logo-skeleton').classList.add('d-none');
          document.getElementById('login-body-skeleton').classList.add('d-none');
          document.getElementById('login-body-real').classList.remove('d-none');
        }

        if (window.location.search.includes('env_changed=true')) {
          Swal.fire("Konfigurasi Diperbarui", "Perubahan lingkungan database terdeteksi. Sesi lama telah dibersihkan otomatis, silakan login kembali ke sistem.", "info");
        }
      });

      // ==========================================
      // ==========================================
      // FUNGSI LOGIN
      // ==========================================
      async function prosesLogin(event) {
        event.preventDefault();
        const namaUser = document.getElementById("inputNama").value.trim();
        const password = document.getElementById("inputPassword").value;
        const btnLogin = document.querySelector(".btn-login");

        btnLogin.disabled = true;
        btnLogin.innerHTML = "Memeriksa...";

        try {
          // Bersihkan sesi lama jika pengguna belum logout sempurna (Mencegah konflik auth_id)
          try {
            await supabaseClient.auth.signOut();
          } catch(e) {
            console.warn("signOut non-fatal error:", e);
          }

          // Helper terenkripsi untuk mencari & mencocokkan akun secara aman (Hybrid RPC + Direct Query + Auto Seed)
          async function findAndValidateUser(nama, pass) {
            // 1. Coba via RPC link_my_account terlebih dahulu (Keamanan Terpusat di Postgres)
            try {
              const { data: rpcData, error: rpcErr } = await supabaseClient.rpc("link_my_account", {
                p_nama: nama,
                p_password: pass,
              });
              if (!rpcErr && rpcData) {
                return rpcData;
              }
              if (rpcErr && rpcErr.message && rpcErr.message.includes("salah")) {
                throw new Error(rpcErr.message);
              }
            } catch (e) {
              if (e.message && e.message.includes("salah")) throw e;
              console.warn("RPC link_my_account tidak tersedia/gagal. Menggunakan fallback query...", e);
            }

            // 2. Fallback: Query aman ke tabel public.users menggunakan Parameterized Filter Supabase
            const { data: users, error: usersErr } = await supabaseClient
              .from("users")
              .select("id, nama, role, no_hp, cabang, auth_id, hari_libur, sisa_cuti, password")
              .ilike("nama", nama)
              .eq("password", pass);

            if (usersErr) {
              console.error("Users table query error:", usersErr);
              if (usersErr.code === "42P01" || (usersErr.message && usersErr.message.includes("does not exist"))) {
                throw new Error("Tabel database belum dibuat! Silakan jalankan file db/01_starter_schema.sql di SQL Editor Supabase.");
              }
            }

            if (users && users.length > 0) {
              return users[0];
            }

            // 3. Fallback Auto-Seed: Hanya untuk Akun Master 'Super Admin' & 'admin123' jika tabel users kosong
            if (nama.trim().toLowerCase() === "super admin" && pass === "admin123") {
              console.info("⚡ [Auto-Seed Aman] Inisialisasi akun Super Admin default...");
              const { data: seeded, error: seedErr } = await supabaseClient
                .from("users")
                .insert([{ nama: "Super Admin", password: "admin123", role: "Super Admin", cabang: "Pusat" }])
                .select();

              if (!seedErr && seeded && seeded.length > 0) {
                return seeded[0];
              }
            }

            throw new Error("Nama Pengguna atau Password salah!");
          }

          // 1. WAJIB Validasi DULU ke Database Master (Mencegah Login dengan Nama Lama yang Sudah Diubah Admin)
          const validUser = await findAndValidateUser(namaUser, password);

          // 2. Buat email Auth berbasis NAMA AKTIF karyawan di Database
          const activeDummyEmail = `${validUser.nama.replace(/\s+/g, "").toLowerCase()}@zieabsen.com`;

          // 3. Autentikasi dengan Supabase Auth Engine
          let authResult = await supabaseClient.auth.signInWithPassword({
            email: activeDummyEmail,
            password: password,
          });

          // 4. Jika akun Auth belum pernah dibuat untuk nama aktif ini
          if (authResult.error) {
            let signUpResult = await supabaseClient.auth.signUp({
              email: activeDummyEmail,
              password: password,
            });

            if (signUpResult.error) {
              // Jika email bentrok, buat email unik berbasis ID user
              const uniqueEmail = `${validUser.nama.replace(/\s+/g, "").toLowerCase()}_${validUser.id}@zieabsen.com`;
              signUpResult = await supabaseClient.auth.signUp({
                email: uniqueEmail,
                password: password,
              });

              await supabaseClient.auth.signInWithPassword({
                email: uniqueEmail,
                password: password,
              });
            } else {
              await supabaseClient.auth.signInWithPassword({
                email: activeDummyEmail,
                password: password,
              });
            }
          }

          // 5. Tautkan auth_id terbaru ke tabel public.users untuk user tersebut
          const { data: currentSession } = await supabaseClient.auth.getSession();
          if (currentSession?.session?.user?.id) {
            const authUserId = currentSession.session.user.id;
            validUser.auth_id = authUserId;
            await supabaseClient.from("users").update({ auth_id: authUserId }).eq("id", validUser.id);
          }

          userData = validUser;

          // Simpan sesi login ke LocalStorage (sebagai transisi sebelum full JWT)
          localStorage.setItem("userLogin", JSON.stringify(userData));

          Swal.fire({
            title: "Berhasil Login!",
            text: `Selamat datang kembali, ${userData.nama}!`,
            icon: "success",
            timer: 1500,
            showConfirmButton: false,
            heightAuto: false,
          }).then(() => {
            // Super Admin tidak absen, langsung ke Admin Panel
            if (userData.role === "Super Admin") {
              window.location.href = "admin.html";
            } else {
              // HR dan Karyawan ke halaman absen
              window.location.href = "index.html";
            }
          });
        } catch (err) {
          console.error("Login Error:", err);
          let errMsg = err.message;
          if (!errMsg) {
            try {
              errMsg = JSON.stringify(err);
            } catch (e) {
              errMsg = String(err);
            }
          }
          if (errMsg === "{}")
            errMsg =
              "Kredensial tidak valid atau akun belum diaktifkan (Cek konsol browser).";

          Swal.fire({
            title: "Login Gagal",
            text: errMsg,
            icon: "error",
            heightAuto: false,
          });
          btnLogin.disabled = false;
          btnLogin.innerHTML = "LOGIN";
        }
      }
    </script>
  </body>
</html>
